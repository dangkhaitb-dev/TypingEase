<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelajaran · TypingEase</title>
    <meta name="description" content="Pemutar pelajaran TypingEase: satu layar setiap kali, dengan papan ketik dan tangan yang menunjukkan ke mana setiap jari pergi." />
    <!-- Ini aplikasinya, bukan halaman pendaratan. Alasannya sama dengan /hoc/ dan /en/learn/:
         latihan tidak punya nilai pencarian dan rutenya hidup di hash, jadi halaman ini di luar
         indeks. Juga tidak ada hreflang untuk halaman yang tidak seharusnya diindeks. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/id/belajar/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/id/pelajaran/" id="pt-back">← Kursus</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Memuat…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Mulai pelajaran dari awal" aria-label="Mulai pelajaran dari awal">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Suara tombol (Alt+S)" aria-label="Suara tombol">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Tangan mengikuti tombol (Alt+H)" aria-label="Tangan mengikuti tombol">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Pengaturan papan ketik (Alt+K)" aria-label="Pengaturan papan ketik">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Kemajuan pelajaran" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Memuat pelajaran…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Ketik baris di atas</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Ketuk untuk mengetik</button>
    </div>

    <!-- ui.id.js dulu: setiap modul di bawah menumpuknya di atas nilai bawaan berbahasa Vietnam,
         jadi ia harus sudah ada saat modul-modul itu berjalan. Sengaja skrip klasik — skrip klasik
         berjalan sebelum modul ber-defer, dan keyboard/boot.js bergantung pada urutan itu.
         Tidak ada telex-match.js: Telex adalah metode input bahasa Vietnam dan kursus ini tidak
         pernah sampai ke jalur kode itu.
         data/words/id.js harus dimuat sebelum weak-keys.js, yang membaca daftarnya dari sana. -->
    <script src="/i18n/ui.id.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/id.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.id.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
