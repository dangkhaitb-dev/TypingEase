<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок · TypingEase</title>
    <meta name="description" content="Програвач уроків TypingEase: один екран за раз, з клавіатурою і руками, які показують, куди йде кожен палець." />
    <!-- Застосунок, а не сторінка для пошуку. Те саме міркування, що й для /hoc/ та /learn/:
         вправи не мають пошукової цінності, а маршрут живе в хеші, тож сторінка лишається поза
         індексом. І без hreflang: альтернативи для сторінок, які ніхто не має індексувати, не
         позначають. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/uk/vchytysia/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/uk/uroky/" id="pt-back">← Курс</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Завантаження…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Почати урок спочатку" aria-label="Почати урок спочатку">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Звук клавіш (Alt+S)" aria-label="Звук клавіш">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Руки рухаються за клавішами (Alt+H)" aria-label="Руки рухаються за клавішами">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Налаштування клавіатури (Alt+K)" aria-label="Налаштування клавіатури">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Прогрес уроку" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Урок завантажується…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Надрукуй рядок вище</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Торкнись, щоб друкувати</button>
    </div>

    <!-- ui.uk.js першим: кожен модуль нижче накладає його на власні типові значення, тож він
         мусить існувати, коли ті виконуються. Навмисно класичний скрипт — класичні скрипти
         виконуються раніше за модулі з defer, і саме від цього залежить keyboard/boot.js.
         Тут немає telex-match.js: Telex — це в'єтнамський спосіб введення, і цей курс ніколи не
         доходить до того шляху коду.
         data/words/uk.js має йти перед weak-keys.js, який бере звідти свій список. -->
    <script src="/i18n/ui.uk.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/uk.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.uk.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
