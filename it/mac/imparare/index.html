<!doctype html>
<html lang="it" data-course="it-mac">
  <head>
    <!-- SINH TỰ ĐỘNG bằng scripts/build-family-pages.js từ it/imparare/index.html. Sửa trang gốc rồi chạy lại. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lezione · TypingEase</title>
    <meta name="description" content="Il riproduttore di lezioni di TypingEase: una schermata alla volta, con una tastiera e due mani che ti mostrano dove va ogni dito." />
    <!-- L'applicazione, non una pagina di atterraggio. Stesso ragionamento di /hoc/, /learn/
         e /es/aprender/: gli esercizi non hanno valore di ricerca e il percorso vive nell'hash,
         quindi resta fuori dall'indice. Nemmeno hreflang: non si annotano alternative di pagine
         che nessuno dovrebbe indicizzare. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/it/mac/imparare/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/it/mac/" id="pt-back">← Corso</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Caricamento…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Ricomincia la lezione" aria-label="Ricomincia la lezione">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Suono dei tasti (Alt+S)" aria-label="Suono dei tasti">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Le mani seguono i tasti (Alt+H)" aria-label="Le mani seguono i tasti">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Impostazioni della tastiera (Alt+K)" aria-label="Impostazioni della tastiera">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Avanzamento della lezione" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Caricamento della lezione…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Scrivi la riga qui sopra</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Tocca per scrivere</button>
    </div>

    <!-- ui.it.js per primo: ogni modulo qui sotto lo sovrappone ai propri valori predefiniti in
         vietnamita, quindi deve esistere quando loro girano. È uno script classico di proposito
         — gli script classici girano prima dei moduli con defer, che è esattamente quello da cui
         dipende keyboard/boot.js.
         Qui non c'è telex-match.js: Telex è un metodo di inserimento vietnamita e questo corso
         non arriva mai a quel percorso del codice.
         data/words/it.js deve stare prima di weak-keys.js, che legge da lì il suo elenco. -->
    <script src="/i18n/ui.it.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/it.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.it-mac.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
