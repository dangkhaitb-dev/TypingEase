<!doctype html>
<html lang="nl" data-course="nl-mac">
  <head>
    <!-- SINH TỰ ĐỘNG bằng scripts/build-family-pages.js từ nl/leren/index.html. Sửa trang gốc rồi chạy lại. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Les · TypingEase</title>
    <meta name="description" content="De lesspeler van TypingEase: één scherm tegelijk, met een toetsenbord en twee handen die laten zien waar elke vinger naartoe gaat." />
    <!-- De applicatie, geen landingspagina. Dezelfde redenering als bij /hoc/, /en/learn/ en
         /es/aprender/: de oefeningen hebben geen zoekwaarde en de route leeft in de hash, dus
         blijft de pagina buiten de index. Ook geen hreflang: je annoteert geen alternatieven van
         pagina's die niemand zou moeten indexeren. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/nl/mac/leren/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/nl/mac/" id="pt-back">← Cursus</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Laden…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Les opnieuw beginnen" aria-label="Les opnieuw beginnen">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Toetsgeluid (Alt+S)" aria-label="Toetsgeluid">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Handen volgen de toetsen (Alt+H)" aria-label="Handen volgen de toetsen">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Toetsenbordinstellingen (Alt+K)" aria-label="Toetsenbordinstellingen">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Voortgang van de les" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">De les wordt geladen…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Typ hier de regel hierboven</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Tik om te typen</button>
    </div>

    <!-- ui.nl.js eerst: elke module hieronder legt het over zijn eigen standaardwaarden in het
         Vietnamees, dus het moet bestaan als zij draaien. Bewust een klassiek script — klassieke
         scripts draaien vóór modules met defer, en daar hangt keyboard/boot.js van af.
         Geen telex-match.js: Telex is een Vietnamese invoermethode en deze cursus komt nooit
         bij dat stuk code.
         data/words/nl.js moet vóór weak-keys.js staan, dat er zijn woordenlijst uit leest. -->
    <script src="/i18n/ui.nl.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/nl.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.nl-mac.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
