<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>과 · TypingEase</title>
    <meta name="description" content="TypingEase 연습 화면: 한 번에 한 화면씩, 자판과 손이 손가락마다 어디로 가는지 보여 줘요. 두벌식 한국어 입력기로 쳐요." />
    <!-- 랜딩 페이지가 아니라 앱이에요. /hoc/, /learn/과 같은 이유로 색인에서 빼요: 연습 화면은
         검색 가치가 없고 경로는 해시에 있어요. hreflang도 없어요. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/ko/baeugi/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/ko/gangui/" id="pt-back">← 강의</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">불러오는 중…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="이 과를 처음부터" aria-label="이 과를 처음부터">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="키 소리 (Alt+S)" aria-label="키 소리">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="손이 키를 따라 움직여요 (Alt+H)" aria-label="손이 키를 따라 움직여요">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="자판 설정 (Alt+K)" aria-label="자판 설정">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="과 진행" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">과를 불러오는 중이에요…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">위의 줄을 치세요</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">눌러서 입력</button>
    </div>

    <!-- ui.ko.js가 먼저: 아래 모듈이 자기 기본값(베트남어) 위에 덮어써요. 일반 스크립트로 두세요.
         hangul-match.js는 player.js보다 먼저: 입력기가 ㅎ → 하 → 한으로 고쳐 쓰는 칸을 채점하는
         엔진이에요(TypingEaseHangul). data/words/ko.js는 weak-keys.js보다 먼저. -->
    <script src="/i18n/ui.ko.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/ko.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.ko.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/hangul-match.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
