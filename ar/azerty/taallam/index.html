<!doctype html>
<html lang="ar" dir="rtl" data-course="ar-azerty">
  <head>
    <!-- SINH TỰ ĐỘNG bằng scripts/build-family-pages.js từ ar/taallam/index.html. Sửa trang gốc rồi chạy lại. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>درس · TypingEase</title>
    <meta name="description" content="مشغل دروس TypingEase: شاشة واحدة في كل مرة، مع لوحة مفاتيح ويدين تريانك أين يذهب كل إصبع." />
    <!-- التطبيق، لا صفحة هبوط. التمارين بلا قيمة في البحث والمسار في الـhash، فتبقى خارج الفهرس.
         ولا hreflang: لا تعلن بدائل لصفحات لا ينبغي أن تفهرس. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/ar/azerty/taallam/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/ar/azerty/" id="pt-back">→ الدورة</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">جار التحميل…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="ابدأ الدرس من جديد" aria-label="ابدأ الدرس من جديد">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="صوت المفاتيح (Alt+S)" aria-label="صوت المفاتيح">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="اليدان تتبعان المفاتيح (Alt+H)" aria-label="اليدان تتبعان المفاتيح">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="إعدادات لوحة المفاتيح (Alt+K)" aria-label="إعدادات لوحة المفاتيح">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="تقدم الدرس" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">جار تحميل الدرس…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">اكتب السطر الذي في الأعلى</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">المس للكتابة</button>
    </div>

    <!-- ui.ar.js أولا: كل وحدة أدناه تضعه فوق قيمها الافتراضية، فيجب أن يكون موجودا عند تشغيلها.
         سكربت عادي عمدا، فالسكربتات العادية تعمل قبل الوحدات المؤجلة، وعلى هذا يعتمد keyboard/boot.js.
         لا يوجد telex-match.js هنا: Telex طريقة إدخال فيتنامية لا تصل إليها هذه الدورة.
         data/words/ar.js يجب أن يأتي قبل weak-keys.js الذي يقرأ منه قائمة الكلمات. -->
    <script src="/i18n/ui.ar.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/ar.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.ar-azerty.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
