<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ders · TypingEase</title>
    <meta name="description" content="TypingEase ders oynatıcısı: her seferinde bir ekran, her parmağın nereye gittiğini gösteren bir klavye ve eller." />
    <!-- Uygulama, bir karşılama sayfası değil. /hoc/ ve /en/learn/ ile aynı gerekçe: alıştırmaların
         arama değeri yok ve yol hash içinde yaşıyor, bu yüzden dizinin dışında kalıyor. hreflang da
         yok: kimsenin dizinlememesi gereken sayfalara alternatif işaretlenmez. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/tr/ogren/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/tr/dersler/" id="pt-back">← Kurs</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Yükleniyor…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Dersi baştan başlat" aria-label="Dersi baştan başlat">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Tuş sesi (Alt+S)" aria-label="Tuş sesi">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Eller tuşları izlesin (Alt+H)" aria-label="Eller tuşları izlesin">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Klavye ayarları (Alt+K)" aria-label="Klavye ayarları">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Ders ilerlemesi" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Ders yükleniyor…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Yukarıdaki satırı yaz</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Yazmak için dokun</button>
    </div>

    <!-- Önce ui.tr.js: aşağıdaki her modül onu kendi Vietnamca varsayılanlarının üstüne serer, bu
         yüzden onlar çalışırken var olmalı. Bilerek klasik script — klasik scriptler defer'li
         modüllerden önce çalışır, keyboard/boot.js tam da buna dayanır.
         Burada telex-match.js yok: Telex Vietnamca bir giriş yöntemi ve bu kurs o koda hiç varmaz.
         data/words/tr.js, listesini oradan okuyan weak-keys.js'ten önce gelmeli. -->
    <script src="/i18n/ui.tr.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/tr.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.tr.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
