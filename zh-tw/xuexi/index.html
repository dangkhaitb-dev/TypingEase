<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>課程 · TypingEase</title>
    <meta name="description" content="TypingEase 課程播放器：一次一頁，螢幕鍵盤和雙手會告訴你每根手指該去哪裡。" />
    <!-- Đây là ứng dụng, không phải trang đích. Cùng lý do với /hoc/ và /learn/: bài luyện không
         có giá trị tìm kiếm và route sống trong hash, nên trang nằm ngoài chỉ mục. Cũng không có
         hreflang cho trang không nên được lập chỉ mục. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/zh-tw/xuexi/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/zh-tw/kecheng/" id="pt-back">← 課程</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">載入中…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="從頭開始這一課" aria-label="從頭開始這一課">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="按鍵聲音（Alt+S）" aria-label="按鍵聲音">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="雙手跟著按鍵動（Alt+H）" aria-label="雙手跟著按鍵動">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="鍵盤設定（Alt+K）" aria-label="鍵盤設定">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="課程進度" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">正在載入課程…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">輸入上面這一行</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">點一下開始打字</button>
    </div>

    <!-- ui.zh-tw.js trước: mọi module bên dưới chồng nó lên giá trị mặc định tiếng Việt, nên nó phải
         có sẵn khi chúng chạy. Cố ý là script cổ điển — script cổ điển chạy trước module defer, và
         keyboard/boot.js dựa vào thứ tự đó. Không có telex-match.js: Telex là kiểu gõ tiếng Việt.
         Không cần bộ gõ Chú âm: người học tắt nó (chế độ tiếng Anh), player.js đổi mã phím vật lý thành ký hiệu chú âm (`typeByPosition`).
         data/words/zh-tw.js phải nạp trước weak-keys.js, vốn đọc danh sách từ ở đó. -->
    <script src="/i18n/ui.zh-tw.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/zh-tw.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.zh-tw.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
