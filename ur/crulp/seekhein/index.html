<!doctype html>
<html lang="ur" dir="rtl" data-course="ur-crulp">
  <head>
    <!-- SINH TỰ ĐỘNG bằng scripts/build-family-pages.js từ ur/seekhein/index.html. Sửa trang gốc rồi chạy lại. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سبق · TypingEase</title>
    <meta name="description" content="TypingEase کا سبق پلیئر: ایک وقت میں ایک اسکرین، کی بورڈ اور ہاتھوں کے ساتھ جو دکھاتے ہیں کہ ہر انگلی کہاں جاتی ہے۔" />
    <!-- The app, not a landing page. Same reasoning as /hoc/ and /en/learn/: drills have no
         search value and the route lives in the hash, so it stays out of the index. No hreflang
         either: no alternates are declared for pages nobody should index. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/ur/crulp/seekhein/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/ur/crulp/" id="pt-back">→ کورس</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">لوڈ ہو رہا ہے…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="سبق دوبارہ شروع کریں" aria-label="سبق دوبارہ شروع کریں">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="کلید کی آواز (Alt+S)" aria-label="کلید کی آواز">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="ہاتھ کلیدوں کے ساتھ حرکت کریں (Alt+H)" aria-label="ہاتھ کلیدوں کے ساتھ حرکت کریں">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="کی بورڈ کی ترتیبات (Alt+K)" aria-label="کی بورڈ کی ترتیبات">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="سبق کی پیش رفت" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">سبق لوڈ ہو رہا ہے…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">اوپر والی سطر لکھیں</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">لکھنے کے لیے چھوئیں</button>
    </div>

    <!-- ui.ur.js first: every module below lays it over its own Vietnamese defaults, so it must
         exist when they run. A classic script on purpose — classic scripts run before deferred
         modules, which is exactly what keyboard/boot.js relies on.
         No telex-match.js: Telex is a Vietnamese input method and this course never reaches it.
         data/words/ur.js must come before weak-keys.js, which reads its list from there. -->
    <script src="/i18n/ui.ur.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/ur.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.ur-crulp.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
