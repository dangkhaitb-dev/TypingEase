<!doctype html>
<html lang="de" data-course="de-schweiz">
  <head>
    <!-- SINH TỰ ĐỘNG bằng scripts/build-family-pages.js từ de/lernen/index.html. Sửa trang gốc rồi chạy lại. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lektion · TypingEase</title>
    <meta name="description" content="Der Lektionsplayer von TypingEase: ein Bildschirm nach dem anderen, mit einer Tastatur und zwei Händen, die zeigen, wohin jeder Finger gehört." />
    <!-- Die Anwendung, keine Landingpage. Dieselbe Überlegung wie bei /hoc/, /learn/ und
         /es/aprender/: Übungen haben keinen Suchwert und die Route lebt im Hash, also bleibt die
         Seite aus dem Index. Auch kein hreflang: Alternativen zu Seiten, die niemand indexieren
         soll, werden nicht ausgezeichnet. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/de/schweiz/lernen/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/de/schweiz/" id="pt-back">← Kurs</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Wird geladen…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Lektion noch einmal beginnen" aria-label="Lektion noch einmal beginnen">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Tastenton (Alt+S)" aria-label="Tastenton">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Die Hände folgen den Tasten (Alt+H)" aria-label="Die Hände folgen den Tasten">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Tastatureinstellungen (Alt+K)" aria-label="Tastatureinstellungen">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Fortschritt in der Lektion" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Lektion wird geladen…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Schreib die Zeile von oben ab</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Zum Schreiben tippen</button>
    </div>

    <!-- ui.de.js zuerst: jedes Modul darunter legt es über seine eigenen vietnamesischen
         Vorgaben, also muss es da sein, wenn sie laufen. Bewusst ein klassisches Script —
         klassische Scripts laufen vor Modulen mit defer, und genau darauf verlässt sich
         keyboard/boot.js.
         Kein telex-match.js hier: Telex ist eine vietnamesische Eingabemethode, und dieser Kurs
         erreicht diesen Codepfad nie.
         data/words/de.js muss vor weak-keys.js stehen, das seine Wortliste von dort liest. -->
    <script src="/i18n/ui.de.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/de.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.de-schweiz.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
