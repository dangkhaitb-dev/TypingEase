<!doctype html>
<html lang="fa" dir="rtl" data-course="fa-windows">
  <head>
    <!-- SINH TỰ ĐỘNG bằng scripts/build-family-pages.js từ fa/amoozesh/index.html. Sửa trang gốc rồi chạy lại. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>درس · TypingEase</title>
    <meta name="description" content="پخش‌کنندهٔ درس‌های TypingEase: هر بار یک صفحه، با صفحه‌کلید و دست‌هایی که نشان می‌دهند هر انگشت کجا می‌رود." />
    <!-- برنامه است، نه صفحهٔ فرود. همان استدلال /hoc/ و /learn/: تمرین‌ها ارزش جست‌وجو ندارند
         و مسیر در hash است، پس بیرون از نمایه می‌ماند. hreflang هم ندارد. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/fa/windows/amoozesh/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/fa/windows/" id="pt-back">→ دوره</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">در حال بارگذاری…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="شروع دوبارهٔ درس" aria-label="شروع دوبارهٔ درس">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="صدای کلید (Alt+S)" aria-label="صدای کلید">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="دست‌ها کلیدها را دنبال می‌کنند (Alt+H)" aria-label="دست‌ها کلیدها را دنبال می‌کنند">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="تنظیمات صفحه‌کلید (Alt+K)" aria-label="تنظیمات صفحه‌کلید">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="پیشرفت درس" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">در حال بارگذاری درس…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">خط بالا را تایپ کنید</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">برای تایپ لمس کنید</button>
    </div>

    <!-- ui.fa.js اول: هر ماژول پایین آن را روی مقادیر پیش‌فرض ویتنامی خودش می‌گذارد، پس باید
         وقتی آنها اجرا می‌شوند وجود داشته باشد. عمداً اسکریپت کلاسیک است.
         telex-match.js اینجا نیست: Telex روش ورود ویتنامی است و این دوره هرگز به آن نمی‌رسد.
         data/words/fa.js باید پیش از weak-keys.js بیاید، که فهرستش را از آنجا می‌خواند. -->
    <script src="/i18n/ui.fa.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/fa.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.fa-windows.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
