<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelajaran · TypingEase</title>
    <meta name="description" content="Pemain pelajaran TypingEase: satu skrin pada satu masa, dengan papan kekunci dan tangan yang menunjukkan ke mana setiap jari pergi." />
    <!-- Aplikasi, bukan halaman pendaratan. Latihan tidak bernilai carian dan laluan tinggal di
         dalam hash, jadi halaman ini dikecualikan daripada indeks. Tiada hreflang: halaman yang
         tidak patut diindeks tidak diberi alternatif. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/ms/belajar/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/ms/pelajaran/" id="pt-back">← Kursus</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Memuatkan…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Mulakan pelajaran semula" aria-label="Mulakan pelajaran semula">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Bunyi kekunci (Alt+S)" aria-label="Bunyi kekunci">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Tangan mengikut kekunci (Alt+H)" aria-label="Tangan mengikut kekunci">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Tetapan papan kekunci (Alt+K)" aria-label="Tetapan papan kekunci">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Kemajuan pelajaran" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Memuatkan pelajaran…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Taip baris di atas</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Sentuh untuk menaip</button>
    </div>

    <!-- ui.ms.js dahulu: setiap modul di bawah menindihkannya di atas nilai lalai sendiri, jadi ia
         mesti wujud ketika modul itu berjalan. Skrip klasik dengan sengaja — skrip klasik berjalan
         sebelum modul defer, dan keyboard/boot.js bergantung pada itu.
         Tiada telex-match.js: Telex ialah kaedah input Vietnam dan kursus ini tidak menggunakannya.
         data/words/ms.js mesti dimuat sebelum weak-keys.js, yang membaca senarainya dari situ. -->
    <script src="/i18n/ui.ms.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/ms.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.ms.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
