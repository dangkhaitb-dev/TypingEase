<!doctype html>
<html lang="en" data-course="en-workman">
  <head>
    <!-- SINH TỰ ĐỘNG bằng scripts/build-family-pages.js từ learn/index.html. Sửa trang gốc rồi chạy lại. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson · TypingEase</title>
    <meta name="description" content="The TypingEase lesson player: one screen at a time, with a keyboard and hands showing you where every finger goes." />
    <!-- The app, not a landing page. Same reasoning as /hoc/: the drills have no search value
         and the route lives in the hash, so it stays out of the index. No hreflang pair either
         — you do not annotate alternates for pages nobody should be indexing. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/workman/learn/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/workman/" id="pt-back">← Roadmap</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Loading…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Start the lesson over" aria-label="Start the lesson over">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Key click sound (Alt+S)" aria-label="Key click sound">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Hands follow the keys (Alt+H)" aria-label="Hands follow the keys">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Keyboard settings (Alt+K)" aria-label="Keyboard settings">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Loading lesson…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Type the line shown above</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Tap to type</button>
    </div>

    <!-- ui.en.js first: every module below spreads it over its own Vietnamese defaults, so it
         has to exist by the time they run. It is a classic script on purpose — classic scripts
         execute before deferred modules, which is what keyboard/boot.js relies on.
         No telex-match.js here: Telex is a Vietnamese input method and this course never
         reaches that code path.
         data/words/en.js must come before weak-keys.js, which reads its drill pool. -->
    <script src="/i18n/ui.en.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/en.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.en-workman.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
