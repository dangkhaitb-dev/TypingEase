<!doctype html>
<html lang="es" data-course="es-latinoamerica">
  <head>
    <!-- SINH TỰ ĐỘNG bằng scripts/build-family-pages.js từ es/aprender/index.html. Sửa trang gốc rồi chạy lại. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lección · TypingEase</title>
    <meta name="description" content="El reproductor de lecciones de TypingEase: una pantalla cada vez, con un teclado y unas manos que te enseñan dónde va cada dedo." />
    <!-- La aplicación, no una página de aterrizaje. Mismo razonamiento que /hoc/ y /learn/:
         los ejercicios no tienen valor de búsqueda y la ruta vive en el hash, así que se queda
         fuera del índice. Tampoco hay hreflang: no se anotan alternativas de páginas que nadie
         debería indexar. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/es/latinoamerica/aprender/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/es/latinoamerica/" id="pt-back">← Curso</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Cargando…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Empezar la lección otra vez" aria-label="Empezar la lección otra vez">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Sonido de tecla (Alt+S)" aria-label="Sonido de tecla">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Las manos siguen a las teclas (Alt+H)" aria-label="Las manos siguen a las teclas">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Ajustes del teclado (Alt+K)" aria-label="Ajustes del teclado">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Progreso de la lección" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Cargando la lección…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Escribe la línea de arriba</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Toca para escribir</button>
    </div>

    <!-- ui.es.js primero: cada módulo de abajo lo superpone sobre sus propios valores por
         defecto en vietnamita, así que tiene que existir cuando ellos se ejecutan. Es un script
         clásico a propósito — los scripts clásicos se ejecutan antes que los módulos con defer,
         que es justo de lo que depende keyboard/boot.js.
         Aquí no hay telex-match.js: Telex es un método de entrada vietnamita y este curso nunca
         llega a ese camino del código.
         data/words/es.js tiene que ir antes que weak-keys.js, que lee de ahí su lista. -->
    <script src="/i18n/ui.es.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/es.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.es-latinoamerica.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
