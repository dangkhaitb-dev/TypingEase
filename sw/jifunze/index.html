<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somo · TypingEase</title>
    <meta name="description" content="Kicheza masomo cha TypingEase: skrini moja kwa wakati, na kibodi na mikono inayokuonyesha kila kidole kinakwenda wapi." />
    <!-- Programu, si ukurasa wa kutua. Sababu ileile kama /hoc/ na /en/learn/: mazoezi hayana
         thamani ya utafutaji na njia iko kwenye hash, kwa hiyo inabaki nje ya faharasa. Hakuna
         hreflang pia: hatuandiki mbadala wa kurasa ambazo hazipaswi kuorodheshwa. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/sw/jifunze/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/sw/masomo/" id="pt-back">← Kozi</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Inapakia…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Anza somo upya" aria-label="Anza somo upya">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Sauti ya kitufe (Alt+S)" aria-label="Sauti ya kitufe">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Mikono inafuata vitufe (Alt+H)" aria-label="Mikono inafuata vitufe">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Mipangilio ya kibodi (Alt+K)" aria-label="Mipangilio ya kibodi">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Maendeleo ya somo" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Somo linapakiwa…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Andika mstari ulio juu</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Gusa ili kuandika</button>
    </div>

    <!-- ui.sw.js kwanza (ni /i18n/ui.sw.js, si /sw.js ya mzizi — hiyo ni service worker): kila
         moduli ya chini huipandisha juu ya thamani zake za msingi, kwa hiyo lazima iwepo zinapoendeshwa.
         Ni script ya kawaida kwa makusudi — script za kawaida huendeshwa kabla ya moduli zenye defer,
         na keyboard/boot.js inategemea hilo. Hakuna telex-match.js: kozi hii haifiki njia hiyo.
         data/words/sw.js lazima iwe kabla ya weak-keys.js, inayosoma orodha yake kutoka hapo. -->
    <script src="/i18n/ui.sw.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/sw.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.sw.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
