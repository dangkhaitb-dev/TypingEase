<!doctype html>
<html lang="pl" data-course="pl-qwertz">
  <head>
    <!-- SINH TỰ ĐỘNG bằng scripts/build-family-pages.js từ pl/nauka/index.html. Sửa trang gốc rồi chạy lại. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lekcja · TypingEase</title>
    <meta name="description" content="Odtwarzacz lekcji TypingEase: jeden ekran naraz, z klawiaturą i dłońmi, które pokazują, gdzie idzie każdy palec." />
    <!-- Aplikacja, nie strona docelowa. Ćwiczenia nie mają wartości dla wyszukiwarki, a trasa
         żyje w hashu, więc strona zostaje poza indeksem. Nie ma też hreflang: nie oznacza się
         alternatyw stron, których nikt nie powinien indeksować. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://typingease.site/pl/qwertz/nauka/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/keyboard/keyboard.css" />
    <link rel="stylesheet" href="/player.css" />
  </head>
  <body class="player-page">
    <div class="player" id="player">
      <header class="player-topbar">
        <a class="pt-back" href="/pl/qwertz/" id="pt-back">← Kurs</a>
        <div class="pt-title">
          <span id="pt-unit"></span>
          <strong id="pt-lesson">Wczytywanie…</strong>
        </div>
        <div class="pt-right">
          <span class="pt-screen" id="pt-screen"></span>
          <button class="pt-redo" id="pt-redo" type="button" title="Zacznij lekcję od nowa" aria-label="Zacznij lekcję od nowa">↻</button>
          <button class="pt-toggle" id="pt-sound" type="button" aria-pressed="false" title="Dźwięk klawiszy (Alt+S)" aria-label="Dźwięk klawiszy">🔊</button>
          <button class="pt-toggle" id="pt-hands" type="button" aria-pressed="true" title="Dłonie podążają za klawiszami (Alt+H)" aria-label="Dłonie podążają za klawiszami">✋</button>
          <button class="pt-redo" id="pt-keyboard" type="button" title="Ustawienia klawiatury (Alt+K)" aria-label="Ustawienia klawiatury">⚙</button>
        </div>
      </header>

      <div class="progress-segments" id="pt-progress" role="progressbar" aria-label="Postęp lekcji" aria-valuemin="0" aria-valuenow="0"></div>

      <div class="player-notes" id="player-note" hidden></div>

      <main class="player-stage is-loading" id="stage">
        <section class="card"><p class="intro-text">Wczytywanie lekcji…</p></section>
      </main>

      <div class="player-board keyboard-demo" id="board" aria-hidden="true"></div>

      <p class="player-live" id="live" role="status" aria-live="polite"></p>

      <label class="sr-only" for="player-input">Przepisz linię powyżej</label>
      <textarea class="player-input" id="player-input" rows="1" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" inputmode="text" aria-describedby="live"></textarea>

      <button class="tap-to-type" id="tap-to-type" type="button">Dotknij, aby pisać</button>
    </div>

    <!-- ui.pl.js najpierw: każdy moduł poniżej nakłada go na własne wartości domyślne (po
         wietnamsku), więc musi istnieć, zanim one ruszą. Zwykły skrypt, celowo — zwykłe skrypty
         wykonują się przed modułami z defer, a od tego zależy keyboard/boot.js.
         Nie ma tu telex-match.js: Telex to wietnamska metoda wprowadzania, a ten kurs nigdy do
         tej ścieżki kodu nie dochodzi.
         data/words/pl.js musi być przed weak-keys.js, który bierze z niego listę słów. -->
    <script src="/i18n/ui.pl.js"></script>
    <script src="/profile.js"></script>
    <script src="/data/words/pl.js"></script>
    <script src="/weak-keys.js"></script>
    <script src="/data/curriculum.pl-qwertz.js"></script>
    <script src="/progress-store.js"></script>
    <script src="/badges.js"></script>
    <script src="/keyboard/ready.js"></script>
    <script type="module" src="/keyboard/boot.js"></script>
    <script src="/sound.js"></script>
    <script src="/player.js"></script>
    <script src="/sw-register.js"></script>
  </body>
</html>
